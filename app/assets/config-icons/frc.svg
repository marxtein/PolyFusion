<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="FRC mirror-style sketch">
  <g transform="translate(0 -264) scale(1 2.016)" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
    <!-- End coils / end planes -->
    <ellipse cx="150" cy="260" rx="20" ry="82" stroke-width="6.4"/>
    <ellipse cx="1050" cy="260" rx="20" ry="82" stroke-width="6.4"/>

    <!-- 1st and 5th lines retained from the magnetic-mirror visual grammar -->
    <path d="M 95 206
             C 210 206 250 132 600 132
             C 950 132 990 206 1105 206"
          stroke-width="9.2"/>
    <path d="M 95 314
             C 210 314 250 388 600 388
             C 950 388 990 314 1105 314"
          stroke-width="9.2"/>

    <!-- 3rd line: central axis changed to dashed line -->
    <path d="M 180 260 H 1020" stroke="#777777" stroke-width="4.8" stroke-dasharray="14 14" opacity="0.8"/>

    <!-- 2nd and 4th lines: replaced by two closed elliptical loops -->
    <ellipse cx="600" cy="206" rx="270" ry="42" stroke-width="7.2"/>
    <ellipse cx="600" cy="314" rx="270" ry="42" stroke-width="7.2"/>
  </g>
</svg>
