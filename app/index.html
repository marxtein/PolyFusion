<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PolyFusion &middot; 多位形零维系统设计台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root{--ink:#080b12;--ink2:#0b0f18;--panel:#0e1320;--panel2:#11182a;--line:#1b2334;--line2:#26324a;
    --fg:#e9eef7;--mut:#7c8aa6;--dim:#4b566c;--amber:#ffb02e;--amber-d:#cf8a16;--teal:#36e2c4;--red:#ff5d73;--r:8px;
    --btn-ink:#0a0f18;--app-grad-a:rgba(255,176,46,.07);--app-grad-b:rgba(54,226,196,.06);
    --hdr-grad:linear-gradient(180deg,rgba(17,24,42,.9),rgba(10,14,22,.7));--scan-bg:rgba(8,11,18,.5);
    --vignette:radial-gradient(120% 100% at 50% 0%,transparent 60%,rgba(0,0,0,.55));--micro-grid:rgba(255,255,255,.013);
    --glow:0 0 0 1px rgba(255,176,46,.4),0 0 18px -4px rgba(255,176,46,.55)}
  /* ---- LIGHT THEME (default) ---- */
  :root[data-theme=light]{--ink:#eceff5;--ink2:#ffffff;--panel:#ffffff;--panel2:#f2f5fb;--line:#e0e5ee;--line2:#c3cddc;
    --fg:#16212f;--mut:#51607a;--dim:#8c9ab0;--amber:#a96a00;--amber-d:#855300;--teal:#0e9486;--red:#d23f54;
    --app-grad-a:rgba(255,176,46,.10);--app-grad-b:rgba(14,148,134,.08);
    --hdr-grad:linear-gradient(180deg,#ffffff,#eef2f8);--scan-bg:rgba(20,30,48,.03);
    --vignette:none;--micro-grid:rgba(20,30,48,.018);
    --glow:0 0 0 1px rgba(169,106,0,.35),0 0 16px -5px rgba(169,106,0,.4)}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;color:var(--fg);background:var(--ink);font-family:"Chakra Petch","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:13.5px;-webkit-font-smoothing:antialiased;overflow:hidden;
    background-image:radial-gradient(900px 520px at 74% -8%,var(--app-grad-a),transparent 60%),
      radial-gradient(760px 520px at 4% 108%,var(--app-grad-b),transparent 60%),
      linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:auto,auto,40px 40px,40px 40px;transition:background-color .25s,color .25s}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(var(--micro-grid) 1px,transparent 1px),linear-gradient(90deg,var(--micro-grid) 1px,transparent 1px),
      var(--vignette);background-size:8px 8px,8px 8px,auto}
  header{position:relative;z-index:2;height:52px;display:flex;align-items:center;gap:16px;padding:0 18px;
    border-bottom:1px solid var(--line2);background:var(--hdr-grad);backdrop-filter:blur(6px)}
  .brand .logo{font-weight:700;letter-spacing:.14em;font-size:16px;text-shadow:0 0 16px rgba(255,176,46,.35)}
  .brand .logo b{color:var(--amber)}
  .brand .sub{font-size:10.5px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-left:9px}
  .status{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11px;color:var(--mut);letter-spacing:.07em}
  .status .val{color:var(--fg)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .hbtn{font-family:"Chakra Petch";font-size:11px;letter-spacing:.06em;color:var(--mut);background:var(--panel2);
    border:1px solid var(--line2);border-radius:6px;padding:4px 9px;cursor:pointer;transition:.15s}
  .hbtn:hover{color:var(--fg);border-color:var(--teal)}
  .hbtn.on{color:var(--btn-ink);background:var(--amber);border-color:var(--amber);font-weight:700}
  .wrap{position:relative;z-index:1;display:grid;grid-template-columns:362px 1fr 300px;height:calc(100vh - 52px)}
  .col{overflow-y:auto;overflow-x:hidden}
  .col::-webkit-scrollbar{width:8px}.col::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  .left{border-right:1px solid var(--line);padding:14px}.right{border-left:1px solid var(--line);padding:14px}
  .center{display:flex;flex-direction:column;min-width:0}
  .sec{margin-bottom:14px}
  .sec-t{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:0 0 9px}
  .sec-t::before{content:"";width:13px;height:1px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .sec-t .n{margin-left:auto;color:var(--dim);font-size:10px;letter-spacing:.04em}
  .configs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cfg{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line2);border-radius:var(--r);
    background:var(--panel);color:var(--mut);cursor:pointer;transition:.16s;font-size:12px;font-weight:500}
  .cfg:hover{color:var(--fg);background:var(--panel2)}
  .cfg .ic{width:20px;height:20px;flex:0 0 20px;opacity:.7}
  .cfg.on{color:var(--btn-ink);background:linear-gradient(180deg,var(--amber),var(--amber-d));border-color:var(--amber);box-shadow:var(--glow);font-weight:700}
  .cfg.on .ic *{stroke:var(--btn-ink)!important}.cfg:nth-child(5){grid-column:1/-1}
  select,input,textarea{width:100%;padding:7px 9px;background:var(--ink2);color:var(--fg);border:1px solid var(--line2);
    border-radius:6px;font:13px/1.2 "JetBrains Mono",monospace;transition:.15s;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,176,46,.25)}select{cursor:pointer}
  textarea{min-height:104px;max-height:180px;resize:vertical;line-height:1.35;white-space:pre;overflow:auto;color:#dfe7f5;background:linear-gradient(180deg,#0a0f18,#080c14);box-shadow:inset 0 1px 0 rgba(255,255,255,.025),inset 0 0 0 1px rgba(8,11,18,.35);scrollbar-color:var(--line2) transparent}
  textarea::-webkit-scrollbar{width:8px;height:8px}textarea::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}textarea::-webkit-scrollbar-corner{background:transparent}
  textarea.fourierbox{font-size:12px;letter-spacing:0;border-color:#21304a;background-image:linear-gradient(180deg,rgba(14,19,32,.98),rgba(8,12,20,.98))}
  .grp-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:12px 0 6px;
    padding-bottom:3px;border-bottom:1px dashed var(--line2);opacity:.85;display:flex;justify-content:space-between}
  .grp-h .a0{color:var(--amber);font-family:"JetBrains Mono";text-transform:none;font-size:11.5px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 9px}
  .fld{display:flex;flex-direction:column;min-width:0}
  .advfld{display:none}.show-adv .advfld{display:flex}
  .advbar{margin-bottom:8px}
  .advbtn{width:100%;text-align:left;font-size:11px;color:var(--mut);background:var(--ink2);border:1px dashed var(--line2);border-radius:6px;padding:5px 9px;cursor:pointer}
  .advbtn:hover{border-color:var(--teal);color:var(--fg)}.advbtn.on{border-style:solid;border-color:var(--teal);color:var(--teal)}
  .modefld{grid-column:1/-1}.modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .modebtn{min-width:0;padding:6px 4px;border:1px solid var(--line2);border-radius:6px;background:var(--ink2);color:var(--mut);font:11px/1.15 "Chakra Petch",sans-serif;cursor:pointer}
  .modebtn:hover{border-color:var(--teal);color:var(--fg)}.modebtn.on{border-color:var(--teal);color:var(--teal);background:rgba(54,226,196,.1);font-weight:700}
  .syncgeom{margin-top:6px;width:100%;padding:6px 8px;border:1px dashed var(--line2);border-radius:6px;background:var(--panel2);color:var(--mut);font:11px/1.15 "Chakra Petch",sans-serif;cursor:pointer}
  .syncgeom:hover:not(:disabled){border-color:var(--amber);color:var(--fg)}.syncgeom:disabled{opacity:.42;cursor:not-allowed}
  .fld label{font-size:12px;color:var(--mut);margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help;display:flex;align-items:baseline;gap:6px}
  .fld label .nm{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .fld label .u{color:var(--dim);font-size:10.5px;flex:0 0 auto}.fld.full{grid-column:1/-1}
  .sym{font-family:Georgia,'Times New Roman','STIX Two Math',serif;font-style:italic;font-size:14.5px;color:var(--fg);line-height:1}
  .sym sub{font-size:68%;font-style:italic;line-height:0}
  .kv .k .sym{font-size:13.5px;color:#b9c4d8}
  .thr .k .sym{font-size:13.5px}
  .opt .sym{font-size:12px;color:inherit;font-weight:inherit}
  .scanbox{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:rgba(8,11,18,.5)}
  .axis{margin-bottom:8px}
  .axis .hd{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--teal);letter-spacing:.06em;margin-bottom:5px}
  .axis .hd .tag{font-size:9px;color:var(--btn-ink);background:var(--teal);border-radius:3px;padding:1px 5px;font-weight:700}
  .row3{display:grid;grid-template-columns:1fr 1fr .65fr;gap:5px}.row3 .fld label{font-size:10.5px}
  .thr{display:grid;grid-template-columns:auto auto auto 1fr;gap:5px 7px;align-items:center;margin-bottom:5px}
  .thr .k{font-family:"JetBrains Mono";font-size:12px;color:var(--mut)}.thr .op{color:var(--amber);font-weight:700;text-align:center}
  .thr input[type=checkbox]{accent-color:var(--amber);cursor:pointer;margin:0}
  .thr .off{opacity:.42}
  .opts{display:flex;flex-wrap:wrap;gap:5px}
  .opt{font-size:11.5px;letter-spacing:.03em;color:var(--mut);border:1px solid var(--line2);border-radius:20px;padding:3px 9px;cursor:pointer;user-select:none;transition:.15s}
  .opt.on{color:var(--btn-ink);font-weight:700}
  button.run{width:100%;margin-top:10px;padding:11px;border:0;border-radius:var(--r);cursor:pointer;
    font-family:"Chakra Petch";font-weight:700;letter-spacing:.15em;font-size:12.5px;text-transform:uppercase;
    color:var(--btn-ink);background:linear-gradient(180deg,var(--amber),var(--amber-d));box-shadow:var(--glow);transition:.15s}
  button.run:hover{filter:brightness(1.08);transform:translateY(-1px)}button.run:disabled{filter:grayscale(.5) brightness(.7);cursor:wait;transform:none}
  .err{color:var(--red);font-size:11px;white-space:pre-wrap;margin-top:9px;font-family:"JetBrains Mono"}
  .tabs{display:flex;gap:2px;padding:9px 16px 0;border-bottom:1px solid var(--line)}
  .tab{padding:8px 16px;font-size:12px;letter-spacing:.05em;color:var(--mut);cursor:pointer;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;transition:.15s}
  .tab:hover{color:var(--fg)}.tab.on{color:var(--amber);background:var(--panel);border-color:var(--line2)}
  .plotbar{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:12px;color:var(--mut)}.plotbar b{color:var(--amber)}
  .chip{margin-left:auto;display:flex;gap:7px}
  .chip span{font-size:10px;letter-spacing:.04em;color:var(--mut);border:1px solid var(--line2);border-radius:20px;padding:2px 9px;background:var(--panel)}
  .chip b{color:var(--teal);font-family:"JetBrains Mono"}
  .phsel{margin-left:14px;display:inline-flex;align-items:center;gap:5px}
  .geomodes{display:inline-flex;gap:4px;margin:4px 0}.gmodebtn{padding:2px 8px;font-size:12px;border:1px solid #8894a3;border-radius:4px;background:#1a1f2e;color:#8894a3;cursor:pointer}.gmodebtn.on{background:#2a4a6b;color:#38e6ff;border-color:#38e6ff}
  .phbtn{font-size:10.5px;color:var(--mut);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;background:var(--panel);cursor:pointer;font-family:"JetBrains Mono"}
  .phbtn:hover{border-color:var(--teal);color:var(--fg)}
  .phbtn.on{border-color:var(--teal);color:var(--teal);background:rgba(54,226,196,.1)}
  #plot{flex:1;min-height:0;width:100%}
  .badge{display:inline-flex;font-size:10px;letter-spacing:.08em;color:var(--teal);border:1px solid rgba(54,226,196,.35);border-radius:20px;padding:2px 8px;text-transform:uppercase}
  .grp{margin-bottom:12px}
  .grp-t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 5px;padding-bottom:3px;border-bottom:1px dashed var(--line2)}
  .kv{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px solid rgba(27,35,52,.5)}
  .kv .k{font-size:12.5px;color:var(--mut)}.kv .v{font-family:"JetBrains Mono";font-size:13px;color:var(--fg);font-weight:500}
  .kv .v .u{color:var(--dim);font-size:9.5px;margin-left:2px}
  .kv.hot .v{color:var(--amber)}.kv.cool .v{color:var(--teal)}.kv.warn .v{color:var(--red)}
  .exports{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .exports button{padding:7px;font-size:10.5px;letter-spacing:.04em;background:var(--panel2);color:var(--mut);
    border:1px solid var(--line2);border-radius:6px;cursor:pointer;font-family:"Chakra Petch";transition:.15s}
  .exports button:hover{color:var(--fg);border-color:var(--teal)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(4,7,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
  .modal.on{display:flex}
  .modal .box{width:min(640px,90vw);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:22px 26px;box-shadow:0 30px 80px -20px #000}
  .modal h3{margin:0 0 4px;color:var(--amber);letter-spacing:.05em}
  .modal p,.modal li{color:var(--mut);font-size:13px;line-height:1.7}.modal b{color:var(--fg)}
  .modal .x{float:right;cursor:pointer;color:var(--mut);font-size:20px;line-height:1}.modal .x:hover{color:var(--fg)}
  /* tokamak G-EQDSK import button (Task 5) */
  .eqbtn{display:flex;align-items:center;gap:8px;width:100%;margin-top:2px;padding:9px 11px;cursor:pointer;
    font-family:"Chakra Petch";font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--teal);
    background:var(--panel2);border:1px solid var(--line2);border-radius:7px;transition:.15s}
  .eqbtn:hover{border-color:var(--teal);background:var(--panel);transform:translateY(-1px);box-shadow:0 4px 14px -8px var(--teal)}
  .eqbtn .ei{font-size:14px;line-height:1}.eqbtn .et{flex:1;text-align:left}
  .eqbtn.ok{color:var(--btn-ink);background:linear-gradient(180deg,var(--teal),#0c7e72);border-color:var(--teal)}
  .eqbtn.ok:hover{filter:brightness(1.06)}
  .eqstat{margin-top:5px;font-size:10.5px;line-height:1.4;color:var(--dim);font-family:"JetBrains Mono"}
  .eqstat.ok{color:var(--teal)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">Poly<b>Fusion</b></span><span class="sub" id="subTitle">Zero-D Reactor Design Console</span></div>
  <div class="status">
    <span id="stCfgL">位形</span> <span class="val" id="stCfg">—</span>
    <span id="stRxL">反应</span> <span class="val" id="stRx">—</span>
    <span><span class="dot"></span> <span class="val">CORE ONLINE</span></span>
    <button class="hbtn" id="helpBtn">?</button>
    <button class="hbtn" id="themeTog" title="主题 / Theme">☾ Dark</button>
    <button class="hbtn" id="langTog" title="语言 / Language">EN</button>
  </div>
</header>
<div class="wrap">
  <div class="col left">
    <div class="sec"><p class="sec-t" data-t="config">位形 Configuration <span class="n" id="cfgN"></span></p><div id="configPick" class="configs"></div></div>
    <div class="sec"><p class="sec-t" data-t="preset">机型预设 Preset</p><select id="preset"></select>
      <div class="exports" style="margin-top:6px"><button id="saveAsP">★ 另存为预设</button><button id="delP" disabled>✕ 删除预设</button></div></div>
    <div class="sec"><p class="sec-t" data-t="params">参数 Parameters <span class="n" data-t="liveN">编辑即重算</span></p><div id="params"></div></div>
    <div class="sec"><p class="sec-t" data-t="window">最佳区判据 Operating Window</p><div id="thresh" class="scanbox"></div></div>
    <div class="sec"><p class="sec-t" data-t="contours">显示等值线 Contours</p><div id="plotOpts" class="opts"></div></div>
    <div class="sec"><p class="sec-t" data-t="scan">POPCON 扫描轴 Scan Axes</p>
      <div class="scanbox">
        <div class="axis"><div class="hd"><span class="tag">X</span><span data-t="xax">横轴</span></div><select id="xkey"></select>
          <div class="row3"><div class="fld"><label>min</label><input id="xmin" type="number" step="any"></div>
          <div class="fld"><label>max</label><input id="xmax" type="number" step="any"></div>
          <div class="fld"><label>N</label><input id="nx" type="number" value="21" min="3"></div></div></div>
        <div class="axis"><div class="hd"><span class="tag">Y</span><span data-t="yax">纵轴</span></div><select id="ykey"></select>
          <div class="row3"><div class="fld"><label>min</label><input id="ymin" type="number" step="any"></div>
          <div class="fld"><label>max</label><input id="ymax" type="number" step="any"></div>
          <div class="fld"><label>N</label><input id="ny" type="number" value="21" min="3"></div></div></div>
        <button class="run" id="run" data-t="runBtn">▶ 运行 POPCON 扫描</button>
        <div id="err" class="err"></div>
      </div>
    </div>
  </div>
  <div class="center">
    <div class="tabs">
      <div class="tab" data-v="popcon">POPCON</div>
      <div class="tab on" data-v="shape" data-t="tabShape">几何/磁面 Geometry</div>
      <div class="tab" data-v="profile" data-t="tabProf">剖面 Profiles</div>
    </div>
    <div class="plotbar"><span id="plotTitle">—</span><div class="chip" id="plotMeta"></div><span class="phsel" id="phControls"></span></div>
    <div id="plot"></div>
  </div>
  <div class="col right">
    <div class="sec"><p class="sec-t" data-t="opPoint">工作点 Operating Point <span class="badge" id="caseBadge"></span></p>
      <div id="results"></div>
      <div class="exports">
        <button id="saveP" data-t="saveP">⬇ 保存参数</button><button id="loadP" data-t="loadP">⬆ 加载参数</button>
        <button id="expJson" data-t="expJson">⬇ 结果 JSON</button><button id="expCsv" data-t="expCsv">⬇ 扫描 CSV</button>
      </div>
      <input id="fileIn" type="file" accept=".json" style="display:none">
      <input id="equilibriumFileIn" type="file" accept=".nc,.h5,.hdf5" style="display:none">
    </div>
  </div>
</div>
<div class="modal" id="help"><div class="box"><span class="x" id="helpX">×</span><div id="helpBody"></div></div></div>
<script>
const COLORS=['#ffb02e','#36e2c4','#ff5d73','#7aa2ff','#c792ff','#9be564','#ffd166','#5ad1ff'];
const RX={1:'D-T',2:'D-D',3:'D-³He',4:'p-¹¹B(Nevins)',5:'p-¹¹B(Sikora)',6:'cat-D-D'};
// name -> [zh desc, en desc, unit, group, symbol html(book notation)]
const META={
  use_tauE:['使用输入 τE (关闭=自洽损失)','use input tauE (off = self-consistent losses)','','conf','τ<sub>E</sub>'],
  use_tauC:['使用输入 τC (关闭=位形快速公式)','use input tauC (off = configuration fast formula)','','conf','τ<sub>C</sub>'],
  tauC:['回旋辐射等效能量损失时间','effective cyclotron-radiation energy-loss time','s','conf','τ<sub>C</sub>'],
  cyclotron_B_nonuniform:['考虑回旋辐射中的磁场不均匀性','include magnetic-field nonuniformity in cyclotron loss','','conf','⟨B<sup>2.5</sup>⟩'],
  geom_weighted:['FRC 有限长度几何加权','FRC finite-length geometry weighting','','geo','geom'],
  sep_model:['FRC 分离面几何模型','FRC separatrix geometry model','','geo','sep'],
  geom_model:['托卡马克几何模型','tokamak geometry model','','geo','geom'],
  icase:['反应类型','Reaction','','rx',''],
  R0:['大半径','major radius','m','geo','R<sub>0</sub>'],A:['环径比','aspect ratio','','geo','A'],a:['小半径','minor radius','m','geo','a'],kappa:['拉长比','elongation','','geo','κ'],

function isPlainObject(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function cloneJson(v){return JSON.parse(JSON.stringify(v));}
function migrateTauC(){
  if(!['mirror','frc','dipole'].includes(CUR))return;
  if(!Object.prototype.hasOwnProperty.call(VALS,'use_tauC'))VALS.use_tauC=0;

function defaultBoundaryShape(R0,N_fp){return{source:'',nfp:N_fp||5,R:[[1,0,1.0]],Z:[[-1,0,1.0]]};}
function isFiniteNum(v){return typeof v==='number'&&isFinite(v);}
function parseBoundaryFourier(text){
  const ns=(text||'').match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/g)||[];
  if(!ns.length)return[];
  if(ns.length%3!==0)return null;
  const arr=[];
  for(let i=0;i<ns.length;i+=3){
    const m=Number(ns[i]),n=Number(ns[i+1]),c=Number(ns[i+2]);
    if(!Number.isInteger(m)||!Number.isInteger(n)||!Number.isFinite(c))return null;
    arr.push([m,n,c]);
  }
  return arr;
}
function simpleAxisVariant(vals=VALS){return{rc:[vals.R0,vals.delta_h],zs:[0,-vals.delta_h],etabar:vals.etabar,source:'synthetic from simple near-axis'};}
function simpleBoundaryVariant(vals=VALS){
  const R0=vals.R0,a=vals.a,N_fp=vals.N_fp,dh=vals.delta_h,axis=simpleAxisVariant(vals);
  const R=[[0,0,0],[1,0,1]],Z=[[-1,0,1]];
  if(a&&Math.abs(dh)>1e-12){R.push([0,1,dh/a]);Z.push([0,-1,-dh/a]);}
  return{shape:{kind:'fourier',nfp:N_fp||5,R,Z,axis_rc:axis.rc.slice(),axis_zs:axis.zs.slice(),source:'synthetic from simple near-axis'},iota:0,Vp_override:0,Sw_override:0,etabar:vals.etabar,source:'synthetic from simple near-axis'};
}
function stellAVolDisplay(){
  if(CUR!=='stellarator')return null;
  const mode=stellGeomMode();
  if((mode==='boundary'||mode==='equilibrium')&&isFiniteNum(VALS.Vp_override)&&VALS.Vp_override>0&&isFiniteNum(VALS.R0)&&VALS.R0>0){
    return Math.sqrt(VALS.Vp_override/(2*Math.PI*Math.PI*VALS.R0));
  }
  const sameMode=LASTRUN&&LASTRUN._geom_mode===mode;
  if(sameMode&&LASTRUN.outputs&&isFiniteNum(LASTRUN.outputs.a_vol))return LASTRUN.outputs.a_vol;
  if(isFiniteNum(VALS.a))return VALS.a;
  return null;
}
function stellAHeaderHtml(){
  if(CUR!=='stellarator'||!isFiniteNum(VALS.a))return '';
  const av=stellAVolDisplay();
  const avHtml=isFiniteNum(av)?` · <i>a<sub>vol</sub></i> = ${av.toFixed(3)} m`:'';
  return `<span class="a0"><i>a</i> = ${VALS.a.toFixed(3)} m${avHtml}</span>`;
}

function inferStellGeomMode(){
  if(isPlainObject(VALS.equilibrium))return'equilibrium';
  if(isPlainObject(VALS.shape))return'boundary';
  if(Array.isArray(VALS.rc)||Array.isArray(VALS.zs))return'axis';
  return'simple';
}

function stashStellGeom(){
  const mode=VALS._geom_mode||inferStellGeomMode();
  if(mode==='boundary'&&isPlainObject(VALS.shape))STELL_STASH.shape=cloneJson(VALS.shape);
  if(mode==='axis'){if(Array.isArray(VALS.rc))STELL_STASH.rc=VALS.rc.slice();if(Array.isArray(VALS.zs))STELL_STASH.zs=VALS.zs.slice();}
  ['iota','Vp_override','Sw_override'].forEach(k=>{if(typeof VALS[k]==='number'&&isFinite(VALS[k])&&VALS[k]>0)STELL_STASH[k]=VALS[k];});
  STELL_STASH.etabar=VALS.etabar;STELL_STASH.delta_h=VALS.delta_h;

// keep the operating point inside the 2-D scan window: if the current value of
// a scanned parameter falls outside [min,max], widen the bracket around it.
function fitAxis(key,minEl,maxEl){
  const v=VALS[key];if(typeof v!=='number'||!isFinite(v))return;
  const vd=v*dsc(key);
  let lo=parseFloat(minEl.value),hi=parseFloat(maxEl.value);
  if(!isFinite(lo)||!isFinite(hi)){const r=RANGES[key]||[0,1];lo=r[0]*dsc(key);hi=r[1]*dsc(key);}
  if(vd>lo&&vd<hi)return;
  if(vd>0){lo=Math.min(lo,vd*0.5);hi=Math.max(hi,vd*1.5);}
  else if(vd<0){lo=Math.min(lo,vd*1.5);hi=Math.max(hi,vd*0.5);}
  else{lo=Math.min(lo,0);hi=Math.max(hi,1);}
  minEl.value=+lo.toPrecision(3);maxEl.value=+hi.toPrecision(3);
}

// unified layer model shared by every config's shape view: each drawn line is
// assigned to one of a fixed set of legend GROUPS; traces in a group carry the

// EVERY config maps its features onto the same six roles + line styles below,
// so the legend reads identically across tokamak/mirror/FRC/dipole/stellarator.
const GEO=()=>THEME!=='light'?
  {boundary:'#36e2c4',wall:'#ff5d8f',flux:'#5fb6c7',open:'#7aa2ff',coil:'#ff5d8f',annot:'#c792ff',

   bfill:'rgba(14,148,134,.08)'};

//   open = dotted 1.05            annot = whatever the marker needs
const SHAPE_GROUPS=()=>{const g=GEO();return{boundary:[L('等离子体边界','plasma boundary'),g.boundary],
  wall:[L('壁面','wall'),g.wall],flux:[L('磁面/磁力线','flux surfaces'),g.flux],
  open:[L('开放场线/SOL','open field lines'),g.open],coil:[L('线圈/结构','coils / structure'),g.coil],

    const rn=sh?Math.abs(sh.null_points.r[0]):v.r_s/Math.SQRT2;
    add(lin(ar[0],ar[1],GC('boundary'),2.6,true),'boundary');
    add(lin([-v.l_s/2*1.15,v.l_s/2*1.15],[v.r_w,v.r_w],GC('wall'),2.2),'wall');
    add(lin([-v.l_s/2*1.15,v.l_s/2*1.15],[-v.r_w,-v.r_w],GC('wall'),2.2),'wall');
    // nested poloidal flux surfaces: real backend psi=const loops (audit docs/42
    // P0) when a run is present, else a schematic fallback.
    if(sh&&Array.isArray(sh.surfaces)&&sh.surfaces.length){
      sh.surfaces.forEach(srf=>add(cv(srf.z,srf.r,GC('flux'),1.18,'dash'),'flux'));
    }else{
      [-1,1].forEach(sgn=>[0.30,0.48,0.66,0.84].forEach(q=>{const X=[],Y=[];for(let i=0;i<=180;i++){const th=2*Math.PI*i/180;
          X.push((v.l_s/2)*0.78*q*Math.cos(th));Y.push(sgn*rn+sgn*(v.r_s-rn)*0.86*q*Math.sin(th));}
        add(cv(X,Y,GC('flux'),1.18,'dash'),'flux');}));
    }
    // open SOL field lines outside the separatrix: real backend curves (audit
    // docs/42 P2) when a run is present, else a schematic fallback.
    if(sh&&Array.isArray(sh.open_lines)&&sh.open_lines.length){
      sh.open_lines.forEach(ln=>add(cv(ln.z,ln.r,GC('open'),1.05,'dot'),'open'));
    }else{
      [-0.72,-0.48,0.48,0.72].forEach(yy=>add(cv([-v.l_s/2*1.15,-v.l_s/2*0.95,-v.l_s/2*0.72,v.l_s/2*0.72,v.l_s/2*0.95,v.l_s/2*1.15],
        [yy*v.r_w,yy*v.r_w,yy*v.r_s*0.86,yy*v.r_s*0.86,yy*v.r_w,yy*v.r_w],GC('open'),1.05,'dot'),'open'));
    }
    // O point (magnetic axis / field null) and X points (separatrix on axis)
    const opR=sh?sh.o_points.r:[rn,-rn],opZ=sh?sh.o_points.z:[0,0];
    add({type:'scatter',mode:'markers+text',x:opZ,y:opR,text:[L('O 点','O-point'),L('O 点','O-point')],
      textposition:['top center','bottom center'],textfont:{color:'#c792ff',size:10},
      marker:{color:'#c792ff',size:9,symbol:'circle-open',line:{width:2,color:'#c792ff'}}},'annot');
    const xpZ=sh?sh.x_points.z:[v.l_s/2,-v.l_s/2],xpR=sh?sh.x_points.r:[0,0];
    add({type:'scatter',mode:'markers+text',x:xpZ,y:xpR,text:[L('X 点','X-point'),L('X 点','X-point')],
      textposition:['middle right','middle left'],textfont:{color:'#ff9f43',size:10},
      marker:{color:'#ff9f43',size:9,symbol:'x-thin',line:{width:2,color:'#ff9f43'}}},'annot');
    // reversed internal field (the defining FRC feature): inside the field null
    // r<r_s/sqrt2 the axial field B_z<0, i.e. points -z (left). Arrowhead must
    // point left — head (big marker) at the left end, triangle-left symbol.
    add(seg(-0.05*v.l_s,0.18*v.r_s,-0.38*v.l_s,0.18*v.r_s,'#ff6b6b',L('B←','B←'),'triangle-left'),'annot');
    add(seg(-0.50*v.l_s,1.08*v.r_s,-0.15*v.l_s,1.08*v.r_s,'#36e2c4',L('B_e→','B_e→')),'annot');
    add(seg(-0.50*v.l_s,-1.08*v.r_s,-0.15*v.l_s,-1.08*v.r_s,'#36e2c4',L('B_e→','B_e→')),'annot');
    document.getElementById('plotMeta').innerHTML=`<span>${L('分离面来自后端几何；壁 r_w；磁面/反向场为示意','separatrix from backend; wall r_w; flux/reversal schematic')}</span>`;
  }else if(CUR==='dipole'){
    const Lin=(v.L_in_fac!=null?v.L_in_fac:1.5)*v.r_ring;const NL=6;
    for(let j=0;j<NL;j++){const Lj=Lin*Math.pow(v.R_p/Lin,j/(NL-1));const X=[],Y=[];
      for(let i=0;i<=160;i++){const lam=-Math.PI/2+Math.PI*i/160;const rr=Lj*Math.pow(Math.cos(lam),2);
        X.push(rr*Math.cos(lam));Y.push(rr*Math.sin(lam));}
      const isBound=(j===0||j===NL-1);
      add({type:'scatter',mode:'lines',x:X,y:Y,line:{color:isBound?GC('boundary'):GC('flux'),width:isBound?2.6:1.2+0.28*j,dash:'solid'}},isBound?'boundary':'flux');}
    // vacuum vessel wall: Sw = 4*pi*R_p^2 sphere -> circle of radius R_p in (R,Z)
    {const X=[],Y=[];for(let i=0;i<=180;i++){const th=2*Math.PI*i/180;X.push(v.R_p*Math.cos(th));Y.push(v.R_p*Math.sin(th));}
      add(cv(X,Y,GC('wall'),2.2),'wall');}
    add({type:'scatter',mode:'markers',x:[v.r_ring,-v.r_ring],y:[0,0],marker:{color:'#ff5d8f',size:10,symbol:'square'}},'coil');
    add({type:'scatter',mode:'markers+text',x:[Lin,v.R_p],y:[0,0],text:['L<sub>in</sub>','R<sub>p</sub>'],textposition:['bottom center','top center'],
      textfont:{color:'#ffd166',size:11},marker:{color:'#ffd166',size:7,symbol:'diamond'}},'annot');
    add(txt([0.68*v.R_p],[0.55*v.R_p],[L('外壳 dV/dL 更大','larger dV/dL outward')],'#36e2c4'),'annot');
    document.getElementById('plotMeta').innerHTML=`<span>${(v.ring_model?L('有限电流环示意','finite-loop schematic'):L('点偶极示意','point-dipole schematic'))}${L('；真空室壁 R_p；功率沿磁通壳积分','; vessel wall R_p; power integrates over flux shells')}</span>`;
  }
  lay.legend=Object.assign({},lay.legend,{groupclick:'togglegroup'});
  // equal-aspect shape views: set EXPLICIT ranges from the data + the plot's
  // pixel aspect instead of relying on Plotly scaleanchor+autorange, which
  // produces a broken x-range (e.g. width 80 for 4-wide data) that jumps on
  // every redraw. Deterministic ranges => stable view, no "突变".
  if(lay.yaxis&&lay.yaxis.scaleanchor&&!(lay.xaxis&&lay.xaxis.range)){
    const pd=document.getElementById('plot');const w=pd.clientWidth,h=pd.clientHeight;
    // fall back to ~square if the plot is hidden/mid-transition (clientW/H tiny),
    // so a transient bad read can't blow the range up to +/-200
    const ar=(w>50&&h>50)?w/h:1.1;
    let xmn=1e30,xmx=-1e30,ymn=1e30,ymx=-1e30;
    if(lay.__fixbox){({xmn,xmx,ymn,ymx}=lay.__fixbox);}  // stable phi-scrub view
    else tr.forEach(t=>{(t.x||[]).forEach(x=>{if(x!=null&&isFinite(x)){if(x<xmn)xmn=x;if(x>xmx)xmx=x;}});
                   (t.y||[]).forEach(y=>{if(y!=null&&isFinite(y)){if(y<ymn)ymn=y;if(y>ymx)ymx=y;}});});
    if(xmx>xmn&&ymx>ymn){
      const cx=(xmn+xmx)/2,cy=(ymn+ymx)/2;let hx=(xmx-xmn)/2*1.12,hy=(ymx-ymn)/2*1.12;
      if(hx/hy<ar)hx=hy*ar; else hy=hx/ar;
      delete lay.yaxis.scaleanchor;delete lay.yaxis.scaleratio;
      lay.xaxis.range=[cx-hx,cx+hx];lay.yaxis.range=[cy-hy,cy+hy];
      lay.xaxis.autorange=false;lay.yaxis.autorange=false;
    }
  }
  Plotly.react('plot',tr,lay,{responsive:true,displayModeBar:false});
}
function drawProfiles(){
  // Each config gets the profile that matches its confinement physics instead
  // of one shared peaked curve (Task 6):
  //   tokamak/stellarator/mirror : peaked  n=(1-ρ²)^Sn , T=(1-ρ²)^ST  (the 0D
  //                                peaking model; ρ=√(V/Vp) for the closed tori)
  //   FRC                        : HOLLOW rigid-rotor — density peaks at the
  //                                field null (~0.7 r_s), not on axis
  //   dipole                     : ring→edge adiabatic falloff n∝r^-4, T∝r^-8/3
  document.getElementById('plotTitle').innerHTML=`${L('剖面','Profiles')} n(ρ), T(ρ) · <b>${cfgL(CUR)}</b>`;
  const v=VALS,X=[],N=[],TT=[];
  const Sn=isFiniteNum(v.Sn)?v.Sn:0.5,ST=isFiniteNum(v.ST)?v.ST:1.0;
  let note='';
  for(let i=0;i<=100;i++){const rho=i/100;X.push(rho);
    if(CUR==='frc'){
      // rigid-rotor FRC: n peaks at the field-null radius x0=1/√2, vanishing
      // at the axis and the separatrix — the defining hollow FRC profile.
      const x0=1/Math.SQRT2,w=0.26;
      const g=Math.exp(-Math.pow((rho-x0)/w,2));
      N.push(g);TT.push(0.55+0.45*g);  // T flatter than n (rigid-rotor T≈const + bump)
    }else if(CUR==='dipole'){const Li=(v.L_in_fac!=null?v.L_in_fac:1.5);const r=1+rho*(v.R_p/(Li*v.r_ring)-1);N.push(Math.pow(1/r,4));TT.push(Math.pow(1/r,8/3));}
    else{N.push(Math.pow(Math.max(1-rho*rho,0),Sn));TT.push(Math.pow(Math.max(1-rho*rho,0),ST));}}
  if(CUR==='frc')note=L('刚体转子 FRC：密度在磁场零点(≈0.71 r_s)峰化、轴上与分离面为零','rigid-rotor FRC: density peaks at the field null (≈0.71 r_s), zero on axis & separatrix');
  else if(CUR==='dipole')note=L('偶极绝热剖面：n∝r⁻⁴, T∝r⁻⁸ᐟ³（环→外壳）','dipole adiabatic profile: n∝r⁻⁴, T∝r⁻⁸ᐟ³ (ring→outer shell)');
  else note=L(`峰化模型：n=(1−ρ²)^Sn, T=(1−ρ²)^ST  ·  Sn=${Sn}, ST=${ST}`,`peaking model: n=(1−ρ²)^Sn, T=(1−ρ²)^ST  ·  Sn=${Sn}, ST=${ST}`);
  document.getElementById('plotMeta').innerHTML=`<span>${note}</span>`;
  const xl=CUR==='dipole'?L('归一化半径 (环→外)','normalized radius (ring→edge)'):
    CUR==='frc'?L('径向 ρ = r / r_s','radial ρ = r / r_s'):
    (CUR==='stellarator'||CUR==='tokamak')?L('体积半径 ρ=√(V/Vp)','volume radius ρ=√(V/Vp)'):
    L('归一化半径 ρ','normalized radius ρ');
  const nCol=THEME!=='light'?'#ffb02e':'#a96a00',tCol=THEME!=='light'?'#36e2c4':'#0e9486';
  Plotly.react('plot',[{type:'scatter',mode:'lines',x:X,y:N,name:'n/n<sub>0</sub>',line:{color:nCol,width:2.6}},
    {type:'scatter',mode:'lines',x:X,y:TT,name:'T/T<sub>0</sub>',line:{color:tCol,width:2.6}}],LAYOUT(xl,L('归一化值','normalized')),{responsive:true,displayModeBar:false});
}
async function runScan(){
  run.disabled=true;const t=run.textContent;run.textContent='⟳ '+L('计算中…','computing…');err.textContent='';
  try{const xk=xkey.value,yk=ykey.value;
    const body={config:CUR,overrides:clean(),window:getWindow(),xkey:xk,ykey:yk,
      xmin:+xmin.value/dsc(xk),xmax:+xmax.value/dsc(xk),nx:+nx.value,ymin:+ymin.value/dsc(yk),ymax:+ymax.value/dsc(yk),ny:+ny.value};
    const s=await jpost('/api/scan',body);if(s.error){err.textContent=s.error;return;}
    LASTSCAN=s;setView('popcon');
    if(s.n_invalid>0){const m=Object.entries(s.scan_errors||{})[0];
      err.textContent=L(`⚠ ${s.n_invalid} 个扫描点物理无效（空洞显示）`,`⚠ ${s.n_invalid} scan points physically invalid (shown as holes)`)+(m?` — ${m[0]}`:'');}
  }catch(e){err.textContent=String(e);}finally{run.disabled=false;run.textContent=t;}
}
function onLoadFile(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);Object.assign(VALS,d);migrateTauC();migrateCyclotronB();refreshCyclotronScanAxes();if(CUR==='stellarator'){migrateStellRadius();STELL_STASH={};VALS._geom_mode=inferStellGeomMode();stashStellGeom();}buildParams();recompute();}catch(err){document.getElementById('err').textContent='JSON: '+err.message;}};
  rd.readAsText(f);e.target.value='';}
function dl(name,text){const b=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);}
function scanCsv(s){const F=Object.keys(s.fields);let out='# '+s.xkey+','+s.ykey+','+F.join(',')+'\n';
  for(let j=0;j<s.y.length;j++)for(let i=0;i<s.x.length;i++)out+=s.x[i]+','+s.y[j]+','+F.map(f=>s.fields[f][j][i]).join(',')+'\n';return out;}
init();
