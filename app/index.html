<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PolyFusion &middot; 多位形零维系统设计台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root{--ink:#080b12;--ink2:#0b0f18;--panel:#0e1320;--panel2:#11182a;--line:#1b2334;--line2:#26324a;
    --fg:#e9eef7;--mut:#7c8aa6;--dim:#4b566c;--amber:#ffb02e;--amber-d:#cf8a16;--teal:#36e2c4;--red:#ff5d73;--r:8px;
    --glow:0 0 0 1px rgba(255,176,46,.4),0 0 18px -4px rgba(255,176,46,.55)}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;color:var(--fg);background:var(--ink);font-family:"Chakra Petch","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:13.5px;-webkit-font-smoothing:antialiased;overflow:hidden;
    background-image:radial-gradient(900px 520px at 74% -8%,rgba(255,176,46,.07),transparent 60%),
      radial-gradient(760px 520px at 4% 108%,rgba(54,226,196,.06),transparent 60%),
      linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:auto,auto,40px 40px,40px 40px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px),
      radial-gradient(120% 100% at 50% 0%,transparent 60%,rgba(0,0,0,.55));background-size:8px 8px,8px 8px,auto}
  header{position:relative;z-index:2;height:52px;display:flex;align-items:center;gap:16px;padding:0 18px;
    border-bottom:1px solid var(--line2);background:linear-gradient(180deg,rgba(17,24,42,.9),rgba(10,14,22,.7));backdrop-filter:blur(6px)}
  .brand .logo{font-weight:700;letter-spacing:.14em;font-size:16px;text-shadow:0 0 16px rgba(255,176,46,.35)}
  .brand .logo b{color:var(--amber)}
  .brand .sub{font-size:10.5px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-left:9px}
  .status{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11px;color:var(--mut);letter-spacing:.07em}
  .status .val{color:var(--fg)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .hbtn{font-family:"Chakra Petch";font-size:11px;letter-spacing:.06em;color:var(--mut);background:var(--panel2);
    border:1px solid var(--line2);border-radius:6px;padding:4px 9px;cursor:pointer;transition:.15s}
  .hbtn:hover{color:var(--fg);border-color:var(--teal)}
  .hbtn.on{color:var(--ink);background:var(--amber);border-color:var(--amber);font-weight:700}
  .wrap{position:relative;z-index:1;display:grid;grid-template-columns:362px 1fr 300px;height:calc(100vh - 52px)}
  .col{overflow-y:auto;overflow-x:hidden}
  .col::-webkit-scrollbar{width:8px}.col::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  .left{border-right:1px solid var(--line);padding:14px}.right{border-left:1px solid var(--line);padding:14px}
  .center{display:flex;flex-direction:column;min-width:0}
  .sec{margin-bottom:14px}
  .sec-t{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:0 0 9px}
  .sec-t::before{content:"";width:13px;height:1px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .sec-t .n{margin-left:auto;color:var(--dim);font-size:10px;letter-spacing:.04em}
  .configs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cfg{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line2);border-radius:var(--r);
    background:var(--panel);color:var(--mut);cursor:pointer;transition:.16s;font-size:12px;font-weight:500}
  .cfg:hover{color:var(--fg);background:var(--panel2)}
  .cfg .ic{width:20px;height:20px;flex:0 0 20px;opacity:.7}
  .cfg.on{color:var(--ink);background:linear-gradient(180deg,var(--amber),var(--amber-d));border-color:var(--amber);box-shadow:var(--glow);font-weight:700}
  .cfg.on .ic *{stroke:var(--ink)!important}.cfg:nth-child(5){grid-column:1/-1}
  select,input{width:100%;padding:7px 9px;background:var(--ink2);color:var(--fg);border:1px solid var(--line2);
    border-radius:6px;font:13px/1.2 "JetBrains Mono",monospace;transition:.15s;outline:none}
  select:focus,input:focus{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,176,46,.25)}select{cursor:pointer}
  .grp-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:12px 0 6px;
    padding-bottom:3px;border-bottom:1px dashed var(--line2);opacity:.85;display:flex;justify-content:space-between}
  .grp-h .a0{color:var(--amber);font-family:"JetBrains Mono";text-transform:none;font-size:11.5px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 9px}
  .fld{display:flex;flex-direction:column}
  .fld label{font-size:12px;color:var(--mut);margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help;display:flex;align-items:baseline;gap:6px}
  .fld label .nm{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .fld label .u{color:var(--dim);font-size:10.5px;flex:0 0 auto}.fld.full{grid-column:1/-1}
  .sym{font-family:Georgia,'Times New Roman','STIX Two Math',serif;font-style:italic;font-size:14.5px;color:var(--fg);line-height:1}
  .sym sub{font-size:68%;font-style:italic;line-height:0}
  .kv .k .sym{font-size:13.5px;color:#b9c4d8}
  .thr .k .sym{font-size:13.5px}
  .opt .sym{font-size:12px;color:inherit;font-weight:inherit}
  .scanbox{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:rgba(8,11,18,.5)}
  .axis{margin-bottom:8px}
  .axis .hd{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--teal);letter-spacing:.06em;margin-bottom:5px}
  .axis .hd .tag{font-size:9px;color:var(--ink);background:var(--teal);border-radius:3px;padding:1px 5px;font-weight:700}
  .row3{display:grid;grid-template-columns:1fr 1fr .65fr;gap:5px}.row3 .fld label{font-size:10.5px}
  .thr{display:grid;grid-template-columns:auto auto auto 1fr;gap:5px 7px;align-items:center;margin-bottom:5px}
  .thr .k{font-family:"JetBrains Mono";font-size:12px;color:var(--mut)}.thr .op{color:var(--amber);font-weight:700;text-align:center}
  .thr input[type=checkbox]{accent-color:var(--amber);cursor:pointer;margin:0}
  .thr .off{opacity:.42}
  .opts{display:flex;flex-wrap:wrap;gap:5px}
  .opt{font-size:11.5px;letter-spacing:.03em;color:var(--mut);border:1px solid var(--line2);border-radius:20px;padding:3px 9px;cursor:pointer;user-select:none;transition:.15s}
  .opt.on{color:var(--ink);font-weight:700}
  button.run{width:100%;margin-top:10px;padding:11px;border:0;border-radius:var(--r);cursor:pointer;
    font-family:"Chakra Petch";font-weight:700;letter-spacing:.15em;font-size:12.5px;text-transform:uppercase;
    color:var(--ink);background:linear-gradient(180deg,var(--amber),var(--amber-d));box-shadow:var(--glow);transition:.15s}
  button.run:hover{filter:brightness(1.08);transform:translateY(-1px)}button.run:disabled{filter:grayscale(.5) brightness(.7);cursor:wait;transform:none}
  .err{color:var(--red);font-size:11px;white-space:pre-wrap;margin-top:9px;font-family:"JetBrains Mono"}
  .tabs{display:flex;gap:2px;padding:9px 16px 0;border-bottom:1px solid var(--line)}
  .tab{padding:8px 16px;font-size:12px;letter-spacing:.05em;color:var(--mut);cursor:pointer;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;transition:.15s}
  .tab:hover{color:var(--fg)}.tab.on{color:var(--amber);background:var(--panel);border-color:var(--line2)}
  .plotbar{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:12px;color:var(--mut)}.plotbar b{color:var(--amber)}
  .chip{margin-left:auto;display:flex;gap:7px}
  .chip span{font-size:10px;letter-spacing:.04em;color:var(--mut);border:1px solid var(--line2);border-radius:20px;padding:2px 9px;background:var(--panel)}
  .chip b{color:var(--teal);font-family:"JetBrains Mono"}
  #plot{flex:1;min-height:0;width:100%}
  .badge{display:inline-flex;font-size:10px;letter-spacing:.08em;color:var(--teal);border:1px solid rgba(54,226,196,.35);border-radius:20px;padding:2px 8px;text-transform:uppercase}
  .grp{margin-bottom:12px}
  .grp-t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 5px;padding-bottom:3px;border-bottom:1px dashed var(--line2)}
  .kv{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px solid rgba(27,35,52,.5)}
  .kv .k{font-size:12.5px;color:var(--mut)}.kv .v{font-family:"JetBrains Mono";font-size:13px;color:var(--fg);font-weight:500}
  .kv .v .u{color:var(--dim);font-size:9.5px;margin-left:2px}
  .kv.hot .v{color:var(--amber)}.kv.cool .v{color:var(--teal)}.kv.warn .v{color:var(--red)}
  .exports{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .exports button{padding:7px;font-size:10.5px;letter-spacing:.04em;background:var(--panel2);color:var(--mut);
    border:1px solid var(--line2);border-radius:6px;cursor:pointer;font-family:"Chakra Petch";transition:.15s}
  .exports button:hover{color:var(--fg);border-color:var(--teal)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(4,7,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
  .modal.on{display:flex}
  .modal .box{width:min(640px,90vw);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:22px 26px;box-shadow:0 30px 80px -20px #000}
  .modal h3{margin:0 0 4px;color:var(--amber);letter-spacing:.05em}
  .modal p,.modal li{color:var(--mut);font-size:13px;line-height:1.7}.modal b{color:var(--fg)}
  .modal .x{float:right;cursor:pointer;color:var(--mut);font-size:20px;line-height:1}.modal .x:hover{color:var(--fg)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">Poly<b>Fusion</b></span><span class="sub" id="subTitle">Zero-D Reactor Design Console</span></div>
  <div class="status">
    <span id="stCfgL">位形</span> <span class="val" id="stCfg">—</span>
    <span id="stRxL">反应</span> <span class="val" id="stRx">—</span>
    <span><span class="dot"></span> <span class="val">CORE ONLINE</span></span>
    <button class="hbtn" id="helpBtn">?</button>
    <button class="hbtn on" data-lang="zh">中</button><button class="hbtn" data-lang="en">EN</button>
  </div>
</header>
<div class="wrap">
  <div class="col left">
    <div class="sec"><p class="sec-t" data-t="config">位形 Configuration <span class="n" id="cfgN"></span></p><div id="configPick" class="configs"></div></div>
    <div class="sec"><p class="sec-t" data-t="preset">机型预设 Preset</p><select id="preset"></select>
      <div class="exports" style="margin-top:6px"><button id="saveAsP">★ 另存为预设</button><button id="delP" disabled>✕ 删除预设</button></div></div>
    <div class="sec"><p class="sec-t" data-t="params">参数 Parameters <span class="n" data-t="liveN">编辑即重算</span></p><div id="params"></div></div>
    <div class="sec"><p class="sec-t" data-t="window">最佳区判据 Operating Window</p><div id="thresh" class="scanbox"></div></div>
    <div class="sec"><p class="sec-t" data-t="contours">显示等值线 Contours</p><div id="plotOpts" class="opts"></div></div>
    <div class="sec"><p class="sec-t" data-t="scan">POPCON 扫描轴 Scan Axes</p>
      <div class="scanbox">
        <div class="axis"><div class="hd"><span class="tag">X</span><span data-t="xax">横轴</span></div><select id="xkey"></select>
          <div class="row3"><div class="fld"><label>min</label><input id="xmin" type="number" step="any"></div>
          <div class="fld"><label>max</label><input id="xmax" type="number" step="any"></div>
          <div class="fld"><label>N</label><input id="nx" type="number" value="21" min="3"></div></div></div>
        <div class="axis"><div class="hd"><span class="tag">Y</span><span data-t="yax">纵轴</span></div><select id="ykey"></select>
          <div class="row3"><div class="fld"><label>min</label><input id="ymin" type="number" step="any"></div>
          <div class="fld"><label>max</label><input id="ymax" type="number" step="any"></div>
          <div class="fld"><label>N</label><input id="ny" type="number" value="21" min="3"></div></div></div>
        <button class="run" id="run" data-t="runBtn">▶ 运行 POPCON 扫描</button>
        <div id="err" class="err"></div>
      </div>
    </div>
  </div>
  <div class="center">
    <div class="tabs">
      <div class="tab on" data-v="popcon">POPCON</div>
      <div class="tab" data-v="shape" data-t="tabShape">几何/磁面 Geometry</div>
      <div class="tab" data-v="profile" data-t="tabProf">剖面 Profiles</div>
    </div>
    <div class="plotbar"><span id="plotTitle">—</span><div class="chip" id="plotMeta"></div></div>
    <div id="plot"></div>
  </div>
  <div class="col right">
    <div class="sec"><p class="sec-t" data-t="opPoint">工作点 Operating Point <span class="badge" id="caseBadge"></span></p>
      <div id="results"></div>
      <div class="exports">
        <button id="saveP" data-t="saveP">⬇ 保存参数</button><button id="loadP" data-t="loadP">⬆ 加载参数</button>
        <button id="expJson" data-t="expJson">⬇ 结果 JSON</button><button id="expCsv" data-t="expCsv">⬇ 扫描 CSV</button>
      </div>
      <input id="fileIn" type="file" accept=".json" style="display:none">
    </div>
  </div>
</div>
<div class="modal" id="help"><div class="box"><span class="x" id="helpX">×</span><div id="helpBody"></div></div></div>
<script>
const COLORS=['#ffb02e','#36e2c4','#ff5d73','#7aa2ff','#c792ff','#9be564','#ffd166','#5ad1ff'];
const RX={1:'D-T',2:'D-D',3:'D-³He',4:'p-¹¹B(Nevins)',5:'p-¹¹B(Sikora)',6:'cat-D-D'};
// name -> [zh desc, en desc, unit, group, symbol html(book notation)]
const META={
  use_tauE:['使用输入 τE (关闭=自洽损失)','use input tauE (off = self-consistent losses)','','conf','τ<sub>E</sub>'],
  geom_weighted:['FRC 有限长度几何加权','FRC finite-length geometry weighting','','geo','geom'],
  icase:['反应类型','Reaction','','rx',''],
  R0:['大半径','major radius','m','geo','R<sub>0</sub>'],A:['环径比','aspect ratio','','geo','A'],kappa:['拉长比','elongation','','geo','κ'],
  delta:['三角形变','triangularity','','geo','δ'],g:['壁间隙','wall gap','m','geo','g'],
  a_c:['等离子体半径','plasma radius','m','geo','a<sub>c</sub>'],L_c:['中心室长','cell length','m','geo','L<sub>c</sub>'],R_mirror:['镜比','mirror ratio','','geo','R<sub>m</sub>'],
  r_s:['分离面半径','separatrix radius','m','geo','r<sub>s</sub>'],l_s:['分离面长','separatrix length','m','geo','l<sub>s</sub>'],r_w:['壁半径','wall radius','m','geo','r<sub>w</sub>'],
  r_ring:['环半径','coil radius','m','geo','r<sub>ring</sub>'],R_p:['等离子体外径','plasma outer radius','m','geo','R<sub>p</sub>'],
  Sn:['密度峰化','density peaking','','prof','S<sub>n</sub>'],ST:['温度峰化','temperature peaking','','prof','S<sub>T</sub>'],
  ni0:['中心离子密度','central ion density','m⁻³','plasma','n<sub>i0</sub>'],n0:['峰值密度','peak density','m⁻³','plasma','n<sub>0</sub>'],
  Ti0:['离子温度','ion temperature','keV','plasma','T<sub>i0</sub>'],Ti:['离子温度','ion temperature','keV','plasma','T<sub>i</sub>'],
  Te:['电子温度','electron temperature','keV','plasma','T<sub>e</sub>'],Te0:['电子温度','electron temperature','keV','plasma','T<sub>e0</sub>'],
  fT:['T<sub>e0</sub>/T<sub>i0</sub> 比','T<sub>e0</sub>/T<sub>i0</sub> ratio','','plasma','f<sub>T</sub>'],
  BT0:['环向场','toroidal field','T','field','B<sub>T0</sub>'],B0:['磁场','field','T','field','B<sub>0</sub>'],B_vac:['中心真空场','central vacuum field','T','field','B<sub>vac</sub>'],
  B_e:['外加轴向场','external field','T','field','B<sub>e</sub>'],B_ring:['环表面场','coil field','T','field','B<sub>ring</sub>'],
  Ip:['等离子体电流','plasma current','MA','field','I<sub>p</sub>'],iota:['旋转变换 (0=用几何值)','rotational transform (0 = geometric)','','field','ι'],
  f1:['燃料配比','fuel mix','','fuel','f<sub>1</sub>'],fHe:['氦灰份额','helium ash','','fuel','f<sub>He</sub>'],fimp:['杂质份额','impurity','','fuel','f<sub>imp</sub>'],Zimp:['杂质电荷','impurity charge','','fuel','Z<sub>imp</sub>'],
  imp_name:['线辐射元素 (Mavrin; 关闭=只算轫致)','line-radiation species (off = brems only)','','fuel','imp'],
  tauE:['能量约束时间','energy confinement time','s','conf','τ<sub>E</sub>'],
  H_fac:['τE 自洽模式的目标 H 因子','target H factor for tauE=0 mode','','conf','H<sub>fac</sub>'],fsig:['反应率因子','reactivity factor','','conf','f<sub>σ</sub>'],Rw:['壁反射率','wall reflectivity','','conf','R<sub>w</sub>'],
  f_ren:['ISS04 位形因子','ISS04 factor','','conf','f<sub>ren</sub>'],f_belt:['约束带占比','belt fraction','','conf','f<sub>belt</sub>'],
  f_throat:['喉部长度占比','throat fraction','','geo','f<sub>th</sub>'],
  f_shape:['分离面形状因子','separatrix shape (2/3=椭圆,1=跑道)','','geo','f<sub>V</sub>'],
  L_in_fac:['内边界/环半径','inner boundary in ring radii','','geo','L<sub>in</sub>/r<sub>c</sub>'],
  N_fp:['场周期数','field periods','','geo','N<sub>fp</sub>'],
  delta_h:['轴螺旋偏移','helical axis excursion','m','geo','δ<sub>h</sub>'],
  etabar:['近轴形参 η̄ (塑形;拉长比为输出)','near-axis shaping η̄ (elongation is derived)','1/m','geo','η̄'],
  Vp_override:['等离子体体积实测覆盖 (0=几何算)','plasma volume override (0=use geometry)','m³','geo','V_p^*'],
  Sw_override:['壁面积实测覆盖 (0=几何算)','wall-area override (0=use geometry)','m²','geo','S_w^*'],
  rc:['自定义轴 R 傅里叶 (逗号分隔; 留空=用 δ_h)','custom axis R Fourier (comma list; blank=use δ_h)','','geo','rc'],
  zs:['自定义轴 Z 傅里叶 (逗号分隔; 留空=用 δ_h)','custom axis Z Fourier (comma list; blank=use δ_h)','','geo','zs'],
  ring_model:['有限环几何 (0=点偶极,1=载流环)','finite-ring geometry (0=point,1=loop)','','geo','ring'],
  f_alpha:['α沉积份额 (留空=损失锥自动)','alpha deposit fraction (blank = loss-cone auto)','','conf','f<sub>α</sub>'],
  B_expand:['端部扩张比','expander ratio','','conf','B<sub>exp</sub>'],
  phi_i_over_Te:['电势比 (0=自动 T<sub>e</sub>·lnR)','potential ratio (0 = auto Te lnR)','','conf','φ<sub>i</sub>/T<sub>e</sub>'],lnLambda:['库仑对数','Coulomb log','','conf','ln Λ']};
// config display names per language
const CFGN={tokamak:['托卡马克','Tokamak'],mirror:['磁镜','Mirror'],frc:['场反位形','FRC'],dipole:['偶极场','Dipole'],stellarator:['仿星器','Stellarator']};
const cfgL=n=>{const c=CFGN[n]||[n,n];return LANG==='zh'?c[0]:c[1];};
// output keys -> book-notation symbol html (no underscores)

async function loadPreset(){

  if(pv.startsWith(UMARK)){
    // user preset: server doesn't know it -> load locally and recompute via overrides
    const name=pv.slice(UMARK.length);const stored=upGet(CUR)[name];
    if(!stored){await selectConfig(CUR);return;}   // gone (e.g. cleared) -> reset
    VALS=JSON.parse(JSON.stringify(stored));
    buildParams();buildThresh();buildPlotOpts();fitScanRanges();
    await recompute();setView(VIEW);

  }
  const r=await jpost('/api/run',{config:CUR,preset:pv});

  if((name in upGet(CUR))&&!confirm(L('已存在同名预设，覆盖？','A preset with this name exists. Overwrite?')))return;

  loadPreset();

// keep the operating point inside the 2-D scan window: if the current value of
// a scanned parameter falls outside [min,max], widen the bracket around it.
function fitAxis(key,minEl,maxEl){
  const v=VALS[key];if(typeof v!=='number'||!isFinite(v))return;
  const vd=v*dsc(key);
  let lo=parseFloat(minEl.value),hi=parseFloat(maxEl.value);
  if(!isFinite(lo)||!isFinite(hi)){const r=RANGES[key]||[0,1];lo=r[0]*dsc(key);hi=r[1]*dsc(key);}
  if(vd>lo&&vd<hi)return;
  if(vd>0){lo=Math.min(lo,vd*0.5);hi=Math.max(hi,vd*1.5);}
  else if(vd<0){lo=Math.min(lo,vd*1.5);hi=Math.max(hi,vd*0.5);}
  else{lo=Math.min(lo,0);hi=Math.max(hi,1);}
  minEl.value=+lo.toPrecision(3);maxEl.value=+hi.toPrecision(3);
}

function bestMarkerCloud(s,xs,ys){
  const x=[],y=[],seen=new Set(),rows=new Set(),cols=new Set();
  const add=(xx,yy)=>{const key=`${xx}|${yy}`;if(!seen.has(key)){seen.add(key);x.push(xx);y.push(yy);}};
  for(let j=0;j<s.y.length;j++)for(let i=0;i<s.x.length;i++)if(s.best[j][i]){
    rows.add(j);cols.add(i);add(xs[i],ys[j]);
  }
  const base=x.length;
  if(!base)return{x,y,size:4,opacity:0.85};
  const thin=rows.size<=2||cols.size<=2||base<=Math.max(6,Math.ceil(Math.min(s.x.length,s.y.length)/3));
  if(thin){
    const fill=(a0,a1,b0,b1,n=3)=>{for(let k=1;k<n;k++){const t=k/n;add(a0+(a1-a0)*t,b0+(b1-b0)*t);}};
    for(const j of rows){
      const is=[];for(let i=0;i<s.x.length;i++)if(s.best[j][i])is.push(i);
      for(let n=0;n<is.length-1;n++)if(is[n+1]-is[n]<=2)fill(xs[is[n]],xs[is[n+1]],ys[j],ys[j]);
    }
    for(const i of cols){

    }

    }else document.getElementById('plotMeta').innerHTML=`<span>${L('等待后端解析磁面','waiting for backend flux surfaces')}</span>`;
  }else if(CUR==='mirror'){
    const Lc=v.L_c,a=v.a_c,Rm=v.R_mirror||10,ft=(v.f_throat!=null?v.f_throat:0.1),gg=v.g||0;
    const Lth=ft*Lc,Z=[],Rr=[];
    const prof=z=>{const az=Math.abs(z);if(az<=Lc/2)return a;const t=Math.min((az-Lc/2)/Math.max(Lth,1e-6),1);
      return a/Math.sqrt(1+(Rm-1)*Math.pow(Math.sin(Math.PI*t/2),2));};
    for(let i=0;i<=160;i++){const z=-Lc/2-Lth+(Lc+2*Lth)*i/160;Z.push(z);Rr.push(prof(z));}
    const Zb=[...Z,...[...Z].reverse()],Rb=[...Rr,...[...Rr].reverse().map(r=>-r)];
    add(lin(Zb,Rb,'#ffb02e',2.4,true),'boundary');
    add(lin([-Lc/2-Lth,Lc/2+Lth],[a+gg,a+gg],GC('wall'),2.2),'wall');
    add(lin([-Lc/2-Lth,Lc/2+Lth],[-(a+gg),-(a+gg)],GC('wall'),2.2),'wall');
    [0.35,0.65,0.88].forEach(q=>{add(cv(Z,Rr.map(r=>q*r),GC('flux'),1.2,'dash'),'flux');add(cv(Z,Rr.map(r=>-q*r),GC('flux'),1.2,'dash'),'flux');});
    const zt=Lc/2+Lth,rt=prof(zt);
    add(cv([zt,zt],[-rt,rt],'#c792ff',2.2,'dot'),'annot');
    add(cv([-zt,-zt],[-rt,rt],'#c792ff',2.2,'dot'),'annot');
    add({type:'scatter',mode:'markers',x:[-zt,zt],y:[0,0],marker:{color:'#36e2c4',size:10,symbol:'line-ns-open'}},'annot');
    add(txt([-zt,zt],[-rt*1.35,rt*1.35],['B↑','B↑'],'#36e2c4'),'annot');
    lay=LAYOUT('z [m]',L('r [m]（径向放大）','r [m] (radial enlarged)'));
    lay.xaxis.range=[-Lc/2-Lth*1.15,Lc/2+Lth*1.15];lay.yaxis.range=[-(a+gg)*1.75,(a+gg)*1.75];
    document.getElementById('plotMeta').innerHTML=`<span>${L('径向放大显示磁通管收缩；壁含间隙 g；端面积为通量诊断','radial enlarged; wall includes gap g; throat area diagnostic')}</span>`;
  }else if(CUR==='frc'){
    const sh=(LASTRUN&&LASTRUN.shape&&LASTRUN.shape.type==='frc')?LASTRUN.shape:null;
    const fs=(v.f_shape!=null?v.f_shape:0.85),p=sh?sh.p_shape:Math.min(2/(3*Math.max(1-fs,0.017)),40);
    const superE=(lam=1)=>{const X=[],Y=[];for(let i=0;i<=220;i++){const th=2*Math.PI*i/220,c=Math.cos(th),s=Math.sin(th);
      const cr=Math.sign(c)*Math.pow(Math.abs(c),2/p),sr=Math.sign(s)*Math.pow(Math.abs(s),2/p);
      X.push(lam*(v.l_s/2)*cr);Y.push(lam*v.r_s*sr);}return[X,Y];};
    const ar=sh?[sh.separatrix.z,sh.separatrix.r]:superE(1);
    const rn=sh?Math.abs(sh.null_points.r[0]):v.r_s/Math.SQRT2;
    add(lin(ar[0],ar[1],'#ffb02e',2.4,true),'boundary');
    add(lin([-v.l_s/2*1.15,v.l_s/2*1.15],[v.r_w,v.r_w],GC('wall'),2.2),'wall');
    add(lin([-v.l_s/2*1.15,v.l_s/2*1.15],[-v.r_w,-v.r_w],GC('wall'),2.2),'wall');
    [-1,1].forEach(sgn=>[0.30,0.48,0.66,0.84].forEach(q=>{const X=[],Y=[];for(let i=0;i<=180;i++){const th=2*Math.PI*i/180;
        X.push((v.l_s/2)*0.78*q*Math.cos(th));Y.push(sgn*rn+sgn*(v.r_s-rn)*0.86*q*Math.sin(th));}
      add(cv(X,Y,GC('flux'),1.18,'dash'),'flux');}));
    [-0.72,-0.48,0.48,0.72].forEach(yy=>add(cv([-v.l_s/2*1.15,-v.l_s/2*0.95,-v.l_s/2*0.72,v.l_s/2*0.72,v.l_s/2*0.95,v.l_s/2*1.15],
      [yy*v.r_w,yy*v.r_w,yy*v.r_s*0.86,yy*v.r_s*0.86,yy*v.r_w,yy*v.r_w],GC('open'),1.05,'dot'),'open'));
    add({type:'scatter',mode:'markers+text',x:[0,0],y:[rn,-rn],text:[L('O 点','O-point'),L('O 点','O-point')],
      textposition:['top center','bottom center'],textfont:{color:'#c792ff',size:10},
      marker:{color:'#c792ff',size:9,symbol:'circle-open',line:{width:2,color:'#c792ff'}}},'annot');
    add(seg(-0.38*v.l_s,0.18*v.r_s,-0.05*v.l_s,0.18*v.r_s,'#ff6b6b',L('B←','B←')),'annot');
    add(seg(-0.50*v.l_s,1.08*v.r_s,-0.15*v.l_s,1.08*v.r_s,'#36e2c4',L('B_e→','B_e→')),'annot');
    add(seg(-0.50*v.l_s,-1.08*v.r_s,-0.15*v.l_s,-1.08*v.r_s,'#36e2c4',L('B_e→','B_e→')),'annot');
    document.getElementById('plotMeta').innerHTML=`<span>${L('分离面来自后端几何；壁 r_w；磁面/反向场为示意','separatrix from backend; wall r_w; flux/reversal schematic')}</span>`;
  }else if(CUR==='dipole'){
    const Lin=(v.L_in_fac!=null?v.L_in_fac:1.5)*v.r_ring;const NL=6;
    for(let j=0;j<NL;j++){const Lj=Lin*Math.pow(v.R_p/Lin,j/(NL-1));const X=[],Y=[];
      for(let i=0;i<=160;i++){const lam=-Math.PI/2+Math.PI*i/160;const rr=Lj*Math.pow(Math.cos(lam),2);
        X.push(rr*Math.cos(lam));Y.push(rr*Math.sin(lam));}
      const isBound=(j===0||j===NL-1);
      add({type:'scatter',mode:'lines',x:X,y:Y,line:{color:isBound?'#ffb02e':GC('flux'),width:1.2+0.28*j,dash:'solid'}},isBound?'boundary':'flux');}
    // vacuum vessel wall: Sw = 4*pi*R_p^2 sphere -> circle of radius R_p in (R,Z)
    {const X=[],Y=[];for(let i=0;i<=180;i++){const th=2*Math.PI*i/180;X.push(v.R_p*Math.cos(th));Y.push(v.R_p*Math.sin(th));}
      add(cv(X,Y,GC('wall'),2.0,'dash'),'wall');}
    add({type:'scatter',mode:'markers',x:[v.r_ring,-v.r_ring],y:[0,0],marker:{color:'#ff5d8f',size:10,symbol:'square'}},'coil');
    add({type:'scatter',mode:'markers+text',x:[Lin,v.R_p],y:[0,0],text:['L<sub>in</sub>','R<sub>p</sub>'],textposition:['bottom center','top center'],
      textfont:{color:'#ffd166',size:11},marker:{color:'#ffd166',size:7,symbol:'diamond'}},'annot');
    add(txt([0.68*v.R_p],[0.55*v.R_p],[L('外壳 dV/dL 更大','larger dV/dL outward')],'#36e2c4'),'annot');
    document.getElementById('plotMeta').innerHTML=`<span>${(v.ring_model?L('有限电流环示意','finite-loop schematic'):L('点偶极示意','point-dipole schematic'))}${L('；真空室壁 R_p；功率沿磁通壳积分','; vessel wall R_p; power integrates over flux shells')}</span>`;
  }
  lay.legend=Object.assign({},lay.legend,{groupclick:'togglegroup'});
  Plotly.react('plot',tr,lay,{responsive:true,displayModeBar:false});
}
function drawProfiles(){
  document.getElementById('plotTitle').innerHTML=`${L('剖面','Profiles')} n(x), T(x) · <b>${cfgL(CUR)}</b>`;document.getElementById('plotMeta').innerHTML='';
  const v=VALS,X=[],N=[],TT=[];
  for(let i=0;i<=100;i++){const x=i/100;X.push(x);
    if('Sn'in v){N.push(Math.pow(1-x*x,v.Sn));TT.push(Math.pow(1-x*x,v.ST));}
    else if(CUR==='dipole'){const Li=(v.L_in_fac!=null?v.L_in_fac:1.5);const r=1+x*(v.R_p/(Li*v.r_ring)-1);N.push(Math.pow(1/r,4));TT.push(Math.pow(1/r,8/3));}
    else{N.push(1);TT.push(1);}}
  const xl=CUR==='dipole'?L('归一化半径 (环→外)','normalized radius'):L('归一化小半径 x=r/a','normalized x=r/a');
  Plotly.react('plot',[{type:'scatter',mode:'lines',x:X,y:N,name:'n/n<sub>0</sub>',line:{color:'#ffb02e',width:2.6}},
    {type:'scatter',mode:'lines',x:X,y:TT,name:'T/T<sub>0</sub>',line:{color:'#36e2c4',width:2.6}}],LAYOUT(xl,L('归一化值','normalized')),{responsive:true,displayModeBar:false});
}
async function runScan(){
  run.disabled=true;const t=run.textContent;run.textContent='⟳ '+L('计算中…','computing…');err.textContent='';
  try{const xk=xkey.value,yk=ykey.value;
    const body={config:CUR,overrides:clean(),window:getWindow(),xkey:xk,ykey:yk,
      xmin:+xmin.value/dsc(xk),xmax:+xmax.value/dsc(xk),nx:+nx.value,ymin:+ymin.value/dsc(yk),ymax:+ymax.value/dsc(yk),ny:+ny.value};
    const s=await jpost('/api/scan',body);if(s.error){err.textContent=s.error;return;}
    LASTSCAN=s;setView('popcon');
    if(s.n_invalid>0){const m=Object.entries(s.scan_errors||{})[0];
      err.textContent=L(`⚠ ${s.n_invalid} 个扫描点物理无效（空洞显示）`,`⚠ ${s.n_invalid} scan points physically invalid (shown as holes)`)+(m?` — ${m[0]}`:'');}
  }catch(e){err.textContent=String(e);}finally{run.disabled=false;run.textContent=t;}
}
function onLoadFile(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);Object.assign(VALS,d);buildParams();recompute();}catch(err){document.getElementById('err').textContent='JSON: '+err.message;}};
  rd.readAsText(f);e.target.value='';}
function dl(name,text){const b=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);}
function scanCsv(s){const F=Object.keys(s.fields);let out='# '+s.xkey+','+s.ykey+','+F.join(',')+'\n';
  for(let j=0;j<s.y.length;j++)for(let i=0;i<s.x.length;i++)out+=s.x[i]+','+s.y[j]+','+F.map(f=>s.fields[f][j][i]).join(',')+'\n';return out;}
init();
</script>
